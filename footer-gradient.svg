<svg width="800" height="80" viewBox="0 0 800 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="movingGradFooter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a5fb4">
        <animate attributeName="stop-color"
          values="#1a5fb4;#001f4d;#00001a;#001f4d;#1a5fb4"
          dur="14s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#001f4d">
        <animate attributeName="stop-color"
          values="#001f4d;#00001a;#1a5fb4;#00001a;#001f4d"
          dur="14s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00001a">
        <animate attributeName="stop-color"
          values="#00001a;#1a5fb4;#001f4d;#1a5fb4;#00001a"
          dur="14s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>
  <rect width="800" height="80" rx="24" fill="url(#movingGradFooter)" />
</svg>
